- aid: energyhub:marketplace-api
  name: EnergyHub Marketplace API
  description: The Marketplace API integrates the Mercury/Edge DERMS platform with utility marketplace
    providers and online retailers so that a consumer buying a DER device can be pre-enrolled in a
    utility demand-response program at the point of sale. EnergyHub's 2021-05-13 announcement says
    the API "automates the verification of DER program eligibility, incentive processing, and enrollment
    for a seamless workflow from the point of sale to program enrollment" and that "The open Marketplace
    API can connect with any retail transaction, online and brick-and-mortar." Named launch integrators
    are EFI, Enervee, and Uplight. Despite the word "open" in the announcement, no public documentation,
    base URI, schema, authentication scheme, or signup was found on any EnergyHub property probed
    on 2026-07-27; access is via a commercial marketplace partnership.
  humanURL: https://www.energyhub.com/news/marketplace-api-announcement
