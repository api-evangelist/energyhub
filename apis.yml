apis:
- aid: energyhub:mercury-edge-connect-api
  name: EnergyHub Mercury Edge Connect API
  description: Mercury Edge Connect is EnergyHub's standardized integration framework for connecting
    DER providers (thermostat, battery, EV, EV charger, and solar inverter manufacturers) to the Mercury/Edge
    DERMS platform. EnergyHub states in its 2021-02-18 announcement that "At the heart of Mercury
    Edge Connect is a new API designed specifically to meet the requirements of managing behind-the-meter
    DERs at scale. The API is based on the Open ADR standard, with enhanced functionality around automated
    enrollment, monitoring, and other functionality required for managing enterprise-wide portfolios
    of grid-edge and customer-owned DERs." No public reference documentation, schema, or operation
    list is published. The host mec.energyhub.com (the name matches Mercury Edge Connect; that mapping
    is inferred, not stated by EnergyHub) was probed on 2026-07-27 and is live behind a valid DigiCert
    RapidSSL certificate for CN=mec.energyhub.com, returning HTTP 400 "No required SSL certificate
    was sent" to every anonymous request on /, /openapi.json, /swagger.json, /docs, /api-docs, /.well-known/openid-configuration,
    /health, /v1, /api, and /oadr, which is mutual TLS client-certificate authentication consistent
    with the OpenADR 2.0b VEN/VTN security model. Access requires a DER partner agreement.
  humanURL: https://www.energyhub.com/news/mercury-edge-connect-announcement
  baseURL: https://mec.energyhub.com
