name: EnergyHub
kind: company
description: 'EnergyHub is a Brooklyn, New York distributed energy resource management system (DERMS)
  vendor and an independent subsidiary of Alarm.com (Nasdaq ALRM), operating in its home market of
  the United States. Its Edge DERMS platform (formerly marketed as Mercury DERMS) lets electric utilities
  enroll, forecast, dispatch, and measure customer-owned distributed energy resources - smart thermostats,
  batteries, electric vehicles and EV chargers, solar inverters, and commercial and industrial loads
  - as virtual power plants, and the company says it has been running load control programs since
  2009. EnergyHub sits squarely in the private middle layer of the energy value chain. It is not a
  utility, not a retailer, and not a market operator, so no consumer energy data mandate applies to
  it: there is no Green Button obligation, no Consumer Data Right designation, and no Ontario regulation
  in play. Its API posture is honestly partner-only and entirely undocumented in public. Two APIs
  are publicly announced by the company - the Mercury Edge Connect API, which EnergyHub states is
  "based on the Open ADR standard", and a Marketplace API for demand-response pre-enrollment at the
  device point of sale - but neither has public reference documentation, a published base URI, a schema,
  or a self-serve signup. The knowledge base at help.energyhub.com serves a public landing page while
  every technical guide and device-partner integration article behind it is gated by an Okta SSO login.
  A live host at mec.energyhub.com answers TLS with a valid DigiCert certificate and rejects every
  anonymous request with "400 No required SSL certificate was sent", which is mutual-TLS client-certificate
  enforcement rather than a public API. No consumer usage or billing data API exists for third parties,
  and no open grid or market data is published, so EnergyHub is closed on both the consumer-data and
  the market-data axis, and a developer gets in only by signing a commercial or DER partner agreement.'
