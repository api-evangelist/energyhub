source: EnergyHub public statements plus live probes; no OpenAPI exists to derive from
note: |
  EnergyHub publishes no machine-readable contract, so nothing here is derived from a spec.
  Every entry below is either a verbatim vendor statement (recorded as claimed, not certified)
  or a probe result. Standards that were specifically checked and NOT found are recorded with
  conforms: false so a later round does not re-litigate them. No compliance program, audit
  report, or certification of any kind (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) is published
  on any EnergyHub property - only GDPR/CCPA rights language inside the privacy policy - so no
  `Compliance` pointer is wired in apis.yml.
