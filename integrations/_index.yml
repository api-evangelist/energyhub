note: |
  EnergyHub publishes a named DER partner ecosystem - the manufacturers whose device clouds
  connect to the Edge (formerly Mercury) DERMS through the Mercury Edge Connect integration
  framework. This index captures that published list verbatim as the real integration surface.
  Every entry is listing-only: `arazzo: null`, `status: pending-partner-spec`. EnergyHub itself
  publishes no OpenAPI, so there is no provider-side operation to bind, and no workflow can be
  authored without inventing operations. Where a partner already exists as a company repo in the
  api-evangelist network, the slug is recorded in `network` so a future round can pick these up
  the moment an EnergyHub spec becomes available.
  Two further named integration surfaces are recorded separately and are NOT device partners:
  the utility-side REST gateway layer (Siemens, GE Vernova) on the utility-integrations page,
  and the Marketplace API launch integrators EFI, Enervee, and Uplight named in the 2021-05-13
  announcement.
