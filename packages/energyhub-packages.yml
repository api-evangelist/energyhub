summary: |
  EnergyHub publishes no client library or SDK for either of its two APIs. Both the Mercury
  Edge Connect API and the Marketplace API are partner-gated and undocumented, so there is
  nothing for a public SDK to wrap. Every major registry was searched on 2026-07-27 and the
  github.com/energyhub organization (6 public repositories, 5 of them archived) was reviewed:
  it contains only internal engineering tooling - a Haskell Java parser, a Maven partial-build
  plugin, a Selenium framework, and two Go secrets CLIs - and no API client of any kind.
  No `official: true` package is recorded. The near-miss packages below are listed so a future
  round does not have to re-search them; each is third-party or unattributable and is marked
  official: false.
