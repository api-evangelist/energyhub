apisFound:
  - name: Mercury Edge Connect API
    real: true
    publiclyDocumented: false
    evidence: Vendor press release 2021-02-18, verbatim "The API is based on the Open
      ADR standard"; gated docs section /articles/mec/* in the knowledge base; live
      mTLS host mec.energyhub.com.
  - name: Marketplace API
    real: true
    publiclyDocumented: false
    evidence: Vendor press release 2021-05-13; named integrators EFI, Enervee, Uplight.
      Called "open" in marketing, but no artifact, endpoint, or doc is public.
specsHarvested:
  count: 0
  openapi: false
  asyncapi: false
  postman: false
  note: No OpenAPI, Swagger, AsyncAPI, JSON Schema, Postman collection, or any other
    machine-readable contract was found on any EnergyHub property, in its GitHub
    organization, or via any public index. The openapi/ directory is intentionally
    absent — nothing real existed to save, and nothing was fabricated.
findings:
  summary: |
    EnergyHub is a textbook example of the private DERMS layer that sits between
    utilities and customer-owned devices with a completely closed API posture. Two
    genuine APIs exist and are publicly acknowledged by the company — Mercury Edge
    Connect (OpenADR-based, for DER manufacturer clouds) and the Marketplace API (for
    point-of-sale demand-response pre-enrollment) — but neither has a single line of
    public reference documentation, a published base URI, a schema, or a signup path.
    Everything technical is behind Okta SSO in the knowledge base, and the runtime
    endpoint is behind mutual TLS.

    The mandate question is clean and negative: no energy consumer-data obligation
    attaches to EnergyHub at all. It is not a utility, retailer, DNO, or market
    operator. There is no Green Button implementation, no CDR designation, and no
    Ontario regulation exposure — and, importantly, no claim of any, so there is no
    gap between claim and implementation to police here. The interesting split is a
    different one: EnergyHub is closed on BOTH axes. It has no open market data (unlike
    the ISOs/RTOs and EIA in the same market) and no consumer data API (unlike the
    retailers under a real mandate). The only standard it touches is OpenADR, and it
    touches it as a vendor statement rather than a certification.
