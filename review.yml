actions:
  apisYmlCreated: true
  openapiDirectoryCreated: false
  specsSaved: 0
  fabricated: none
  reason: |
    Bootstrap captured identity plus an honest, evidenced record of a fully gated API
    surface. Two real-but-undocumented APIs are listed with their vendor evidence and
    their gate stated in the description. No endpoint, scope, schema, or host was
    invented. The only baseURL recorded (https://mec.energyhub.com) is a host that was
    directly probed and confirmed live; the inference that "mec" stands for Mercury
    Edge Connect is flagged as an inference in both apis.yml and this file.
